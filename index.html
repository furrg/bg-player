‹!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Bloomberg Stream</title> 
    <style> 
        body {
            margin: 0; 
            background-color: black;
}
#video-container {
    position: absolute;
    top: 0; 
    left: 0;
    width: 100vw;
    height: 100vh; 
    display: flex;
    justify-content: center; 
    align-items: center;
}
video {
    width: 100%;
    height: 100%; 
    object-fit: cover;
}
</style>
</head>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
<div id="video-container">
<video id="video" controls autoplay muted></video>
    </div>

<script>
const video = document-getElementById('video');
const streamUrl= "https:///www.bloomberg.com/media-manifest/streams/eu.m3u8";
if (Hls.isSupported()) {
const hls = new Hls();
hls.loadSource(streamUrl);
hls.attachMedia(video);
} else if (video.canPlayTypel=('application/vnd.apple.mpegurl')) {
// For Safari browsers
video.src = streamurl;
} else {
console.error('Your browser does not support HLS playback.');
}
</script>
</body> 
</html>
