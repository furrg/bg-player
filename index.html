<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Bloomberg Stream</title> 
    <style> 
        body {
            margin: 0; 
            background-color: black;
        }

        #video-container {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100vw;
            height: 100vh; 
            display: flex;
            justify-content: center; 
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%; 
            object-fit: cover;
        }
    </style>
</head>
<body>

<div id="video-container">
    <video id="video" controls autoplay muted></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
    const video = document.getElementById('video');  // Corrected typo here
    const streamUrl = "https://www.bloomberg.com/media-manifest/streams/eu.m3u8";  // Fixed the URL
    
    if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        // When the video is ready to play, make it fullscreen automatically
        video.oncanplay = function () {
            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.mozRequestFullScreen) { // Firefox
                video.mozRequestFullScreen();
            } else if (video.webkitRequestFullscreen) { // Chrome, Safari
                video.webkitRequestFullscreen();
            } else if (video.msRequestFullscreen) { // IE/Edge
                video.msRequestFullscreen();
            }
        };
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // For Safari and other browsers that natively support M3U8
        video.src = streamUrl;

        // Same fullscreen logic
        video.oncanplay = function () {
            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.mozRequestFullScreen) { // Firefox
                video.mozRequestFullScreen();
            } else if (video.webkitRequestFullscreen) { // Chrome, Safari
                video.webkitRequestFullscreen();
            } else if (video.msRequestFullscreen) { // IE/Edge
                video.msRequestFullscreen();
            }
        };
    } else {
        console.error('Your browser does not support HLS playback.');
    }
</script>

</body> 
</html>
